kind = "web"
previewPath = "/3d-viewer/"
title = "3D Pregled Namještaja"
version = "1.0.0"
id = "artifacts/3d-viewer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/3d-viewer/" ]
localPort = 18598

[services.development]
run = "pnpm --filter @workspace/3d-viewer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3d-viewer", "run", "build" ]
publicDir = "artifacts/3d-viewer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18598"
BASE_PATH = "/3d-viewer/"
