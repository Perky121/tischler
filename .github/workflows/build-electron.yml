name: Build Electron (Windows .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'electron/**'

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Build Windows installer
        working-directory: electron
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: MegaTischler-Copilot-Setup
          path: |
            electron/dist/*.exe
          retention-days: 90

      - name: Create or update "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Build"
          allowUpdates: true
          removeArtifacts: true
          artifacts: "electron/dist/MegaTischler-Copilot-Setup.exe"
          token: ${{ github.token }}
          prerelease: true
          body: |
            Automatski build — zadnja verzija s `main` grane.

            **Preuzimanje**: klikni na `MegaTischler-Copilot-Setup.exe` ispod (Assets sekcija).

      - name: Show build output
        if: always()
        working-directory: electron
        run: |
          if (Test-Path dist) { Get-ChildItem dist -Recurse } else { Write-Host "dist/ not found" }
        shell: pwsh
