name: Build Electron (Windows .exe)

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
  # Run automatically on version tags (e.g. v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer
        working-directory: electron
        run: npm run build
        env:
          # Disable code signing (no certificate in CI)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: MegaTischler-Copilot-Setup-${{ github.ref_name }}
          path: |
            electron/dist/*.exe
            electron/dist/*.yml
          retention-days: 30

      - name: Show build output
        if: always()
        working-directory: electron
        run: |
          if (Test-Path dist) { Get-ChildItem dist } else { Write-Host "dist/ not found" }
        shell: pwsh
