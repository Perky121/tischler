appId: com.megatischler.copilot
productName: MegaTischler Copilot
copyright: "Copyright © 2024"

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - renderer/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: renderer/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MegaTischler Copilot
  installerIcon: renderer/icon.ico
  uninstallerIcon: renderer/icon.ico
  installerHeader: renderer/icon.ico

publish: null
