<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- JSX is pre-compiled to App.js at build time — no Babel, no unsafe-eval needed -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src *;" />
  <title>MegaTischler Copilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React 18 — bundled locally -->
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>

  <!-- App.jsx pre-compiled by esbuild (npm run compile) -->
  <script src="App.js"></script>
</body>
</html>
