openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MegaTischler Copilot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: knowledge
    description: Knowledge base operations
  - name: chat
    description: Chat operations
  - name: rules
    description: User rules operations
  - name: stolar
    description: Carpentry knowledge learning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /knowledge:
    get:
      operationId: getKnowledge
      tags: [knowledge]
      summary: Get knowledge base
      description: Returns current knowledge base content
      responses:
        "200":
          description: Knowledge base content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"

  /upload-mac:
    post:
      operationId: uploadMac
      tags: [knowledge]
      summary: Upload MAC files
      description: Upload .mac files (multipart/form-data) to update the knowledge base
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Parse error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat:
    post:
      operationId: sendChat
      tags: [chat]
      summary: Send chat message
      description: Send a message to the AI assistant with optional screenshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI response (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stolar:
    get:
      operationId: getStolarKnowledge
      tags: [stolar]
      summary: Get all carpentry knowledge entries
      description: Returns all carpentry terms and their inferred conclusions from stolar_znanje.json
      responses:
        "200":
          description: Carpentry knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StolarKnowledge"

  /stolar/infer:
    post:
      operationId: stolarInfer
      tags: [stolar]
      summary: Infer carpentry conclusions
      description: Given a carpentry term and its definition, asks Claude to generate up to 8 useful conclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StolarInferInput"
      responses:
        "200":
          description: Generated conclusions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StolarInferResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stolar/save:
    post:
      operationId: stolarSave
      tags: [stolar]
      summary: Save or update a carpentry knowledge entry
      description: Saves a term with its definition and confirmed conclusions to stolar_znanje.json. Deduplicates by term name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StolarSaveInput"
      responses:
        "200":
          description: Entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StolarSaveResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rules:
    get:
      operationId: getRules
      tags: [rules]
      summary: Get user rules
      description: Get the current stipe_rules.txt content
      responses:
        "200":
          description: Rules content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
    post:
      operationId: saveRules
      tags: [rules]
      summary: Save user rules
      description: Save stipe_rules.txt content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesInput"
      responses:
        "200":
          description: Rules saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    KnowledgeBase:
      type: object
      properties:
        formulas:
          type: array
          items:
            $ref: "#/components/schemas/FormulaEntry"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterEntry"
        syntax_rules:
          type: array
          items:
            type: string
        stats:
          $ref: "#/components/schemas/KnowledgeStats"
      required:
        - formulas
        - parameters
        - syntax_rules
        - stats

    FormulaEntry:
      type: object
      properties:
        formula:
          type: string
        source:
          type: string
      required:
        - formula
        - source

    ParameterEntry:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        typical_values:
          type: array
          items:
            type: string
      required:
        - name
        - description
        - typical_values

    KnowledgeStats:
      type: object
      properties:
        formulaCount:
          type: integer
        parameterCount:
          type: integer
        fileCount:
          type: integer
      required:
        - formulaCount
        - parameterCount
        - fileCount

    UploadResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        stats:
          $ref: "#/components/schemas/KnowledgeStats"
      required:
        - success
        - message
        - stats

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    ChatInput:
      type: object
      properties:
        message:
          type: string
        screenshot_base64:
          type: ["string", "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - message

    RulesContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    RulesInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    StolarEntry:
      type: object
      properties:
        pojam:
          type: string
        definicija:
          type: string
        zaključci:
          type: array
          items:
            type: string
        timestamp:
          type: string
      required:
        - pojam
        - definicija
        - zaključci
        - timestamp

    StolarKnowledge:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/StolarEntry"
      required:
        - entries

    StolarInferInput:
      type: object
      properties:
        pojam:
          type: string
        definicija:
          type: string
      required:
        - pojam
        - definicija

    StolarInferResult:
      type: object
      properties:
        zaključci:
          type: array
          items:
            type: string
      required:
        - zaključci

    StolarSaveInput:
      type: object
      properties:
        pojam:
          type: string
        definicija:
          type: string
        zaključci:
          type: array
          items:
            type: string
      required:
        - pojam
        - definicija

    StolarSaveResult:
      type: object
      properties:
        ok:
          type: boolean
        entry:
          $ref: "#/components/schemas/StolarEntry"
      required:
        - ok
        - entry

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
